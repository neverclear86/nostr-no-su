name = "nostr_no_su"
version = "0.0.0"
description = "Nostr bunker (NIP-46) and utility server on the BEAM"
repository = { type = "github", user = "neverclear86", repo = "nostr-no-su" }

# Hex には公開しないアプリケーションなので、公開のときだけ必要になる licences と
# links は設定していない。

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
# 上流から改変した stratus を vendor している。改変の内容と理由、戻す条件は
# vendor/stratus/PATCH.md を参照。
stratus = { path = "./vendor/stratus" }
envoy = ">= 1.2.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
mist = ">= 6.0.3 and < 7.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
# バンカーのアカウントストア（Postgres）。同梱プラグイン event_logger も pog を
# 同梱しており、プラグイン側の同名パッケージは本体の版の影に入る。制約は
# plugins-src/event_logger/gleam.toml と一致させ、manifest.toml の版の一致は CI で
# 検査している。
pog = ">= 4.1.0 and < 5.0.0"
gleam_time = ">= 1.10.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
exception = ">= 2.1.1 and < 3.0.0"
# hex / nip19 / nip44 の往復と、楕円曲線の恒等式のプロパティテスト。
qcheck = ">= 1.0.5 and < 2.0.0"
