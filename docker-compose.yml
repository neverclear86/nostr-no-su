services:
  nostr-no-su:
    build: .
    environment:
      # Comma-separated relay URLs to monitor. Empty = monitoring disabled.
      RELAY_URL: ${RELAY_URL-wss://relay.damus.io}
      # Comma-separated relays the bunker subscribes and replies on. Defaults
      # to RELAY_URL; NIP-46-only relays (e.g. relay.nsec.app) work here.
      BUNKER_RELAY_URL: ${BUNKER_RELAY_URL:-}
      PUBKEYS: ${PUBKEYS:-}
      # Comma-separated 64-hex private keys. Empty = bunker disabled.
      # Prefer an untracked .env file over inline values.
      ACCOUNT_KEYS: ${ACCOUNT_KEYS:-}
      # Optional. When unset, a random secret is generated per boot and the
      # bunker:// URIs are printed to the log.
      BUNKER_SECRET: ${BUNKER_SECRET:-}
      # Where monitored events are stored. Empty = the plugin is disabled.
      # Must match the credentials of the postgres service below.
      DATABASE_URL: ${DATABASE_URL-postgres://nostr:nostr@postgres:5432/nostr_no_su}
      # Port the admin UI listens on. Empty = the admin UI is disabled.
      ADMIN_PORT: ${ADMIN_PORT-8080}
      # Inside the container the admin UI must listen on all interfaces,
      # otherwise the published port below cannot reach it. Exposure is limited
      # by binding the published port to the host's loopback instead.
      ADMIN_BIND: 0.0.0.0
      # Optional. When unset, a random password is generated per boot and
      # printed to the log. The user name is always "admin".
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Public URL of the admin UI, used to build the approval page URL sent to
      # clients as auth_url. Defaults to http://localhost:<ADMIN_PORT>; set it
      # when clients reach the admin UI through another host or a proxy.
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
    ports:
      # Published on the host's loopback only: the admin UI speaks plain HTTP
      # and shows bunker:// URIs that contain the connection secret. To reach it
      # from elsewhere, put a TLS-terminating reverse proxy in front of it.
      - "127.0.0.1:${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nostr
      POSTGRES_PASSWORD: nostr
      POSTGRES_DB: nostr_no_su
    # The port is deliberately not published: only the app needs the database,
    # and it reaches it over the compose network.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nostr -d nostr_no_su"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
