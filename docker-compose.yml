services:
  nostr-no-su:
    build: .
    environment:
      # Comma-separated relay URLs to monitor. Empty = monitoring disabled.
      RELAY_URL: ${RELAY_URL:-wss://relay.damus.io}
      # Comma-separated relays the bunker subscribes and replies on. Defaults
      # to RELAY_URL; NIP-46-only relays (e.g. relay.nsec.app) work here.
      BUNKER_RELAY_URL: ${BUNKER_RELAY_URL:-}
      PUBKEYS: ${PUBKEYS:-}
      # Comma-separated 64-hex private keys. Empty = bunker disabled.
      # Prefer an untracked .env file over inline values.
      ACCOUNT_KEYS: ${ACCOUNT_KEYS:-}
      # Optional. When unset, a random secret is generated per boot and the
      # bunker:// URIs are printed to the log.
      BUNKER_SECRET: ${BUNKER_SECRET:-}
    restart: unless-stopped
