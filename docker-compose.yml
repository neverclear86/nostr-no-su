services:
  nostr-no-su:
    build: .
    # 変数の意味は README の「環境変数」の表にある。${...} の値は .env
    # （.env.example を複製して作る）で変える。秘密（ACCOUNT_MASTER_KEY と
    # ADMIN_PASSWORD）の値はこのファイルに書かないこと。${...} の変数を足す、
    # 消す、既定値を変えるときは、.env.example の行も合わせ、
    # sh dev/check_env_example.sh で確かめること。
    environment:
      RELAY_URL: ${RELAY_URL-wss://relay.damus.io}
      BUNKER_RELAY_URL: ${BUNKER_RELAY_URL:-}
      DATABASE_URL: ${DATABASE_URL-postgres://${POSTGRES_USER:-nostr}:${POSTGRES_PASSWORD:-nostr}@postgres:5432/${POSTGRES_DB:-nostr_no_su}}
      ACCOUNT_MASTER_KEY: ${ACCOUNT_MASTER_KEY:-}
      PLUGIN_EVENT_LOGGER_DATABASE_URL: ${PLUGIN_EVENT_LOGGER_DATABASE_URL-postgres://${POSTGRES_USER:-nostr}:${POSTGRES_PASSWORD:-nostr}@postgres:5432/${POSTGRES_DB:-nostr_no_su}}
      PLUGIN_FILE_LOGGER_PATH: ${PLUGIN_FILE_LOGGER_PATH-/tmp/nostr-no-su-events.log}
      ADMIN_PORT: ${ADMIN_PORT-8080}
      ADMIN_BIND: 0.0.0.0
      # ルートが読み取り専用なので、クラッシュダンプは tmpfs の /tmp に書く。
      # コンテナーの再起動で消えるので、残すときは override で volume を
      # マウントし、この値をその下を指すように上書きする。
      ERL_CRASH_DUMP: /tmp/erl_crash.dump
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
      PLUGIN_DIR: ${PLUGIN_DIR-/plugins}
      PLUGIN_CONSOLE_LOGGER_ENABLED: ${PLUGIN_CONSOLE_LOGGER_ENABLED-true}
    volumes:
      # コンテナーは非 root（uid 1000）で動くため、ホスト側は誰でも読める権限に
      # しておくこと（chmod -R a+rX plugins）。プラグインがここへ書くことはない
      # ので読み取り専用でマウントする。
      - ./plugins:/plugins:ro
    ports:
      # ホストのループバックにだけ公開する。管理 UI は平文 HTTP で、接続
      # シークレットを含む bunker:// URI を表示するため。外部から到達させるときは
      # TLS を終端するリバースプロキシーを前に置くこと。
      - "127.0.0.1:${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    # 本体のバンカーはアカウントを Postgres に保存し、event_logger を置けば
    # イベントも同じ Postgres に保存する。Postgres が落ちていても本体は起動し、
    # バンカーは間隔を 5 秒から 2 分まで延ばしながらアカウントの読み込みを再試行する
    # （監視とプラグインは動く）。
    depends_on:
      postgres:
        condition: service_healthy
    # 終了コードによらず再起動する。設定の不備（ACCOUNT_MASTER_KEY が空など）で
    # 終了したときは、docker が間隔を延ばしながら再起動を繰り返し、そのたびに
    # 理由の 1 行が出る。
    restart: unless-stopped
    # ルートは読み取り専用にし、書き込みは /tmp（メモリ上の tmpfs、再起動で
    # 消える）だけにする。wisp の一時ファイルと PLUGIN_FILE_LOGGER_PATH の
    # 既定値、ERL_CRASH_DUMP がここに書く。
    read_only: true
    tmpfs:
      - /tmp
    # 非 root で動き、特権の要る操作をしないので、ケーパビリティーは要らない。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # console_logger が 1 イベント 1 行を出すので、docker のログを
    # 10 MB × 3 世代で打ち切る。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    # ダイジェストで固定する。上げるときはタグとダイジェストを一緒に変える。
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    # 値は .env で変える。効くのは postgres-data volume が空の初回だけ
    # （イメージが初期化時にしか資格情報を反映しない）。アプリの
    # DATABASE_URL と PLUGIN_EVENT_LOGGER_DATABASE_URL の既定値はこの 3 変数
    # から組み立てる。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nostr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nostr}
      POSTGRES_DB: ${POSTGRES_DB:-nostr_no_su}
    # ポートは意図的に公開しない。DB を使うのはアプリだけで、compose の
    # ネットワーク越しに到達できる。
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ はコンテナー内のシェルに展開させ、同じサービスの environment の
      # 値を読む（compose の ${...} で書くと既定値の写しが増える）。
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
