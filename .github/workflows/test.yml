name: test

# PR でだけ走る、軽い検査だけの 1 ジョブ。Postgres と strfry を使う統合テスト、
# docker イメージ、shipment、README のビルド手順の検査は manual.yml に置き、
# 手で起動する（#305）。main への push では走らない。PR の checkout は
# その時点の main とのマージのツリーなので、PR の最後の実行からマージまでに
# main が進んでいなければ、マージ後の main も同じ検査を通る。
#
# ジョブを 1 本にしているのは、GitHub Actions がジョブごとに分単位で切り上げて
# 課金するため。数秒の検査を別ジョブにすると 1 分ずつ取られる。
on:
  pull_request:

permissions:
  contents: read

# PR に push が続くと古い実行を取り消す。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 変えたファイルの一覧に base との差分が要る。
          fetch-depth: 0
      # docs、.claude、*.md、LICENSE だけの PR は検査しない。ジョブは成功で終わり、
      # gh pr checks は pass を報告する。plugins-src と examples の README も、
      # ビルド手順の検査（manual.yml）から外れているので同じ扱い。
      - id: changed
        name: 変えたファイルを分類する
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          # base...head は merge-base からの差分。base との 2 点の diff だと、ブランチの後に
          # main が進んだ分まで数え、docs だけの PR でも検査が走る。
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          code=$(echo "$files" | grep -Ev '^(docs/|\.claude/|LICENSE$|.*\.md$)' || true)
          plugin=$(echo "$code" | grep -E '^(plugins-src/|gleam\.toml$|manifest\.toml$|dev/check_shared_versions\.sh$|\.github/)' || true)
          css=$(echo "$code" | grep -E '^(src/nostr_no_su/admin/|assets/|priv/static/admin\.css$|package(-lock)?\.json$|\.github/)' || true)
          echo "code=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "plugin=$([ -n "$plugin" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "css=$([ -n "$css" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.code == 'true'
        uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      # 依存のソースとコンパイル済みの依存を戻す。鍵が src/ と test/ を含まないので
      # 本体の成果物は除く（path は子を列挙しないと ! が効かないので erlang/* と書く）。
      # 鍵が変われば作り直すので restore-keys は付けない。
      - if: steps.changed.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: |
            build/packages
            build/dev/erlang/*
            !build/dev/erlang/nostr_no_su
          key: gleam-build-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.gleam-version }}-${{ hashFiles('manifest.toml', 'vendor/stratus/**') }}
      - if: steps.changed.outputs.code == 'true'
        run: gleam deps download
      # test/ もコンパイルするので、テストの warning もここで失敗する
      # （gleam test にはこのフラグが無い）。
      - if: steps.changed.outputs.code == 'true'
        run: gleam build --warnings-as-errors
      # TEST_DATABASE_URL を渡さないので、Postgres を使う統合テストと NIP-46 の E2E は
      # スキップされる（manual.yml で走る）。
      - if: steps.changed.outputs.code == 'true'
        run: gleam test
      - if: steps.changed.outputs.code == 'true'
        run: gleam format --check src test dev
      # 例のプラグイン（examples/plugins/*/src/*.erl）が警告なしでコンパイルできることを確かめる。
      # -Wall だけでは警告で失敗しないので -Werror を付ける。成果物はリポジトリの外に出す。
      - if: steps.changed.outputs.code == 'true'
        name: 例のプラグインを警告なしでコンパイルする
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/examples"
          erlc -Wall -Werror -o "$RUNNER_TEMP/examples" examples/plugins/*/src/*.erl
      # vendor/stratus が、hex の上流の tar に vendor/stratus/patches/ のパッチを当てたものと
      # 一致することを確かめる。パッチを足す手順は vendor/stratus/PATCH.md にある。
      - if: steps.changed.outputs.code == 'true'
        run: sh dev/check_vendor_stratus.sh
      # docker-compose.yml の ${...} の変数と既定値が、.env.example の変数の行と一致するかを検査する。
      - if: steps.changed.outputs.code == 'true'
        run: sh dev/check_env_example.sh

      # event_logger プラグイン。影に入る側は本体の版で実行されるため、版がずれると
      # 実行時に undef で壊れる。検査の内容は dev/check_shared_versions.sh。
      - if: steps.changed.outputs.plugin == 'true'
        run: sh dev/check_shared_versions.sh
      - if: steps.changed.outputs.plugin == 'true'
        uses: actions/cache@v6
        with:
          path: |
            plugins-src/event_logger/build/packages
            plugins-src/event_logger/build/dev/erlang/*
            !plugins-src/event_logger/build/dev/erlang/event_logger
          key: gleam-build-event_logger-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.gleam-version }}-${{ hashFiles('plugins-src/event_logger/manifest.toml') }}
      - if: steps.changed.outputs.plugin == 'true'
        name: event_logger を build、test、format --check する
        working-directory: plugins-src/event_logger
        run: |
          set -eu
          gleam deps download
          gleam build --warnings-as-errors
          gleam test
          gleam format --check src test

      # 管理 UI の CSS。生成物をリポジトリに含めているので、描画のモジュール
      # （src/nostr_no_su/admin/ の .gleam。文言の i18n.gleam を除く）か assets/admin.css を
      # 変えたら、ビルドし直してコミットする。クラスを変えなくても、文字列、識別子、
      # コメントの語がクラスの候補になって CSS が変わることがある。忘れるとここで差分が出る。
      - if: steps.changed.outputs.css == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - if: steps.changed.outputs.css == 'true'
        name: ビルドした CSS がコミットされたものと一致することを確かめる
        run: |
          set -eu
          npm ci
          npm run build:css
          git diff --exit-code -- priv/static/admin.css
