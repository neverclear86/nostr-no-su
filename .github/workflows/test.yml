name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# PR に push が続くと古い実行を取り消す。実行のグループは PR ごとに 1 つに
# なる。main への push は squash マージが続くことがあり、取り消すと commit
# に CI の結果が残らないので run ごとに別のグループにする。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # アカウントストアの統合テスト用の使い捨て Postgres。TEST_DATABASE_URL が
      # 無いと統合テストは失敗する（CI=true のときテストが panic する）。
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nostr_no_su_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostr_no_su_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      # 依存のソースとコンパイル済みの依存を戻す。鍵が src/ と test/ を含まないので
      # 本体の成果物は除く（path は子を列挙しないと ! が効かないので erlang/* と書く）。
      # 鍵が変われば作り直すので restore-keys は付けない。
      - uses: actions/cache@v6
        with:
          path: |
            build/packages
            build/dev/erlang/*
            !build/dev/erlang/nostr_no_su
          key: gleam-build-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-gleam${{ steps.beam.outputs.gleam-version }}-${{ hashFiles('manifest.toml', 'vendor/stratus/**') }}
      - run: gleam deps download
      # test/ もコンパイルするので、テストの warning もここで失敗する
      # （gleam test にはこのフラグが無い）。
      - run: gleam build --warnings-as-errors
      - run: gleam test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nostr_no_su_test
      - run: gleam format --check src test dev

  admin-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build:css
      # 生成物をリポジトリに含めているので、描画のモジュール（src/nostr_no_su/admin/ の
      # .gleam。文言の i18n.gleam を除く）か assets/admin.css を変えたら、ビルドし直して
      # コミットする。クラスを変えなくても、文字列、識別子、コメントの語がクラスの候補に
      # なって CSS が変わることがある。忘れるとここで差分が出る。
      - name: ビルドした CSS がコミットされたものと一致することを確かめる
        run: git diff --exit-code -- priv/static/admin.css

  vendor-stratus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # vendor/stratus が、hex の上流の tar に vendor/stratus/patches/ のパッチを当てたものと
      # 一致することを確かめる。パッチを足す手順は vendor/stratus/PATCH.md にある。
      - run: sh dev/check_vendor_stratus.sh

  plugin-event-logger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins-src/event_logger
    services:
      # 統合テスト用の使い捨て Postgres。TEST_DATABASE_URL が無いと統合テストは
      # 失敗する（CI=true のときテストが panic する）。
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nostr_no_su_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostr_no_su_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      # 依存のソースとコンパイル済みの依存を戻す。uses: のステップには working-directory
      # が効かないので、path はリポジトリのルートからのパスで書く。鍵が変われば
      # 作り直すので restore-keys は付けない。
      - uses: actions/cache@v6
        with:
          path: |
            plugins-src/event_logger/build/packages
            plugins-src/event_logger/build/dev/erlang/*
            !plugins-src/event_logger/build/dev/erlang/event_logger
          key: gleam-build-event_logger-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-gleam${{ steps.beam.outputs.gleam-version }}-${{ hashFiles('plugins-src/event_logger/manifest.toml') }}
      - run: gleam deps download
      # 影に入る側は本体の版で実行されるため、版がずれると読み込み時には何も
      # 起きず、実行時に undef で壊れる。ここで止めるのが唯一の自動検出点。
      - name: 共有パッケージの版が本体と一致することを確かめる
        working-directory: .
        run: |
          set -e
          for pkg in gleam_stdlib gleam_erlang gleam_otp gleam_json exception \
            pog pgo pg_types backoff opentelemetry_api gleam_time; do
            host=$(grep -o "name = \"$pkg\", version = \"[^\"]*\"" manifest.toml)
            plugin=$(grep -o "name = \"$pkg\", version = \"[^\"]*\"" plugins-src/event_logger/manifest.toml)
            [ -n "$host" ] && [ -n "$plugin" ] || { echo "$pkg が manifest に無い"; exit 1; }
            [ "$host" = "$plugin" ] || { echo "版がずれている: $host / $plugin"; exit 1; }
          done
      # test/ もコンパイルするので、テストの warning もここで失敗する
      # （gleam test にはこのフラグが無い）。
      - run: gleam build --warnings-as-errors
      - run: gleam test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nostr_no_su_test
      - run: gleam format --check src test
      # 成果物が組めることまで見る。plugins/ に置く成果物はここではなく、
      # 本体と同じ docker イメージの中で作る（plugins-src/event_logger/README.md）。
      - run: gleam export erlang-shipment

  # プラグインの README のビルド手順が、非 root の利用者が貼ったとおりに最後まで通ることと、
  # event_logger の成果物にビルド環境の違いが混ざらないことを確かめる。ビルドは本体と同じ
  # gleam のイメージの中で行うので、ランナーに elixir があるかどうかに左右されない。
  plugin-readme-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # 各 README の「## ビルド」の最初の sh ブロックを、リポジトリーのルートでそのまま
      # 実行する。書き写さないのは README と CI の手順をずらさないため。ランナーは非 root
      # なので、成果物を root 所有にする手順は続く chmod が EPERM で落ちる。
      - name: プラグインの README のビルド手順を実行する
        run: |
          set -eu
          for readme in plugins-src/event_logger/README.md \
            examples/plugins/file_logger/README.md examples/plugins/counter/README.md; do
            awk '/^## / { in_section = /^## ビルド$/ }
                 in_section && /^```sh$/ { in_block = 1; next }
                 in_block && /^```$/ { exit }
                 in_block' "$readme" > "$RUNNER_TEMP/build.sh"
            [ -s "$RUNNER_TEMP/build.sh" ] || { echo "$readme の「## ビルド」に sh ブロックが無い"; exit 1; }
            sh -eu "$RUNNER_TEMP/build.sh"
          done
      # ホストに elixir があると、manifest.toml に無い elixir、mix、logger、eex が同梱される
      # （plugins-src/event_logger/README.md の「ビルド」）。.beam の数は共有パッケージの版を
      # 上げるたびに変わるので、同梱したアプリの名前を manifest.toml と突き合わせる。
      # manifest.toml には同梱されない dev の依存（gleeunit、envoy）も載るので、包含で比べる。
      - name: event_logger の成果物に manifest.toml に無いアプリが無いことを確かめる
        run: |
          set -eu
          export LC_ALL=C
          test -f plugins/event_logger/event_logger/ebin/event_logger.beam
          allowed=$( { echo event_logger; grep -o '^  { name = "[^"]*"' plugins-src/event_logger/manifest.toml | cut -d '"' -f 2; } | sort)
          bundled=$(find plugins/event_logger -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          extra=$(comm -13 <(echo "$allowed") <(echo "$bundled"))
          [ -z "$extra" ] || { echo "manifest.toml に無いアプリが同梱されている:" $extra; exit 1; }

  env-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # docker-compose.yml の ${...} の変数と既定値が、.env.example の変数の行と一致するかを検査する。
      - run: sh dev/check_env_example.sh
