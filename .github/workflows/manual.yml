name: manual

# 手で起動する重い検査（#305）。PR の test.yml には載せず、リリースの前や
# Dockerfile、compose、リレーとの接続、統合テストに関わる変更のあとに
# main で実行する（CONTRIBUTING.md の「リリース」、docs/development.md の
# 「手動の検査」）。Actions の manual を選び「Run workflow」で起動する。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Postgres を使う統合テストと、本体の shipment。
  integration:
    runs-on: ubuntu-latest
    services:
      # アカウントストアの統合テスト用の使い捨て Postgres。
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nostr_no_su_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostr_no_su_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      # 依存のソースとコンパイル済みの依存を戻す。鍵が src/ と test/ を含まないので
      # 本体の成果物は除く（path は子を列挙しないと ! が効かないので erlang/* と書く）。
      # 鍵が変われば作り直すので restore-keys は付けない。
      - uses: actions/cache@v6
        with:
          path: |
            build/packages
            build/dev/erlang/*
            !build/dev/erlang/nostr_no_su
          key: gleam-build-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.gleam-version }}-${{ hashFiles('manifest.toml', 'vendor/stratus/**') }}
      - run: gleam deps download
      # test/ もコンパイルするので、テストの warning もここで失敗する
      # （gleam test にはこのフラグが無い）。
      - run: gleam build --warnings-as-errors
      # TEST_DATABASE_URL を渡すので、Postgres を使う統合テストも走る。
      - run: gleam test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nostr_no_su_test
      # 本体の成果物が組めることまで見る。配布するイメージの成果物は Dockerfile の中で作る。
      - run: gleam export erlang-shipment

  # 実リレー（strfry）を使う NIP-46 の E2E。`gleam test` は TEST_RELAY_URL が
  # 無いとこのテストをスキップするので、strfry のログで実際に実行されたことを
  # 確かめる（後続の step）。
  nip46-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nostr_no_su_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostr_no_su_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      strfry:
        # 既定の設定は 127.0.0.1 に bind し、ポートの転送が届かないので 0.0.0.0 にする。
        # 既定の nofiles（524288）は GitHub Actions ランナーの open files の上限
        # （65536）を超え、起動直後に exit するので 0（設定しない）にする。
        # スレッドを増やすと、並走する 2 本の接続で strfry が `phmap.h: set_ctrl` の
        # assertion で落ちるので、各スレッドを 1 にする。
        image: ghcr.io/hoytech/strfry@sha256:36f1886d185a88ca57c66ebe52e6e9e8428dac2486eea0a5d50ff934f18b60c3
        command: --set relay.bind=0.0.0.0 --set relay.nofiles=0 --set relay.numThreads.ingester=1 --set relay.numThreads.reqWorker=1 --set relay.numThreads.reqMonitor=1 --set relay.numThreads.negentropy=1 relay
        ports:
          - 7777:7777
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      - uses: actions/cache@v6
        with:
          path: |
            build/packages
            build/dev/erlang/*
            !build/dev/erlang/nostr_no_su
          key: gleam-build-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.gleam-version }}-${{ hashFiles('manifest.toml', 'vendor/stratus/**') }}
      - run: gleam deps download
      - name: strfry が応答するまで待つ
        run: |
          timeout 60 sh -c 'until curl -sf -H "Accept: application/nostr+json" http://127.0.0.1:7777/ >/dev/null; do sleep 1; done'
      - run: gleam test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nostr_no_su_test
          TEST_RELAY_URL: ws://127.0.0.1:7777
      - name: E2E がリレーにイベントを書いたことを確かめる
        run: docker logs "${{ job.services.strfry.id }}" 2>&1 | grep -q 'Inserted event'

  # event_logger の統合テストと shipment。
  plugin-event-logger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins-src/event_logger
    services:
      # 統合テスト用の使い捨て Postgres。
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nostr_no_su_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nostr_no_su_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "29"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      # 依存のソースとコンパイル済みの依存を戻す。uses: のステップには working-directory
      # が効かないので、path はリポジトリのルートからのパスで書く。鍵が変われば
      # 作り直すので restore-keys は付けない。
      - uses: actions/cache@v6
        with:
          path: |
            plugins-src/event_logger/build/packages
            plugins-src/event_logger/build/dev/erlang/*
            !plugins-src/event_logger/build/dev/erlang/event_logger
          key: gleam-build-event_logger-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.gleam-version }}-${{ hashFiles('plugins-src/event_logger/manifest.toml') }}
      - run: gleam deps download
      # test/ もコンパイルするので、テストの warning もここで失敗する
      # （gleam test にはこのフラグが無い）。
      - run: gleam build --warnings-as-errors
      # TEST_DATABASE_URL を渡すので、Postgres を使う統合テストも走る。
      - run: gleam test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nostr_no_su_test
      # 成果物が組めることまで見る。plugins/ に置く成果物はここではなく、
      # 本体と同じ docker イメージの中で作る（plugins-src/event_logger/README.md）。
      - run: gleam export erlang-shipment

  # プラグインの README のビルド手順が、非 root の利用者が貼ったとおりに最後まで通ることと、
  # event_logger の成果物にビルド環境の違いが混ざらないことを確かめる。ビルドは本体と同じ
  # gleam のイメージの中で行うので、ランナーに elixir があるかどうかに左右されない。
  plugin-readme-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # 各 README の「## ビルド」の最初の sh ブロックを、リポジトリーのルートでそのまま
      # 実行する。書き写さないのは README と CI の手順をずらさないため。ランナーは非 root
      # なので、成果物を root 所有にする手順は続く chmod が EPERM で落ちる。
      - name: プラグインの README のビルド手順を実行する
        run: |
          set -eu
          for readme in plugins-src/event_logger/README.md \
            examples/plugins/file_logger/README.md examples/plugins/counter/README.md; do
            awk '/^## / { in_section = /^## ビルド$/ }
                 in_section && /^```sh$/ { in_block = 1; next }
                 in_block && /^```$/ { exit }
                 in_block' "$readme" > "$RUNNER_TEMP/build.sh"
            [ -s "$RUNNER_TEMP/build.sh" ] || { echo "$readme の「## ビルド」に sh ブロックが無い"; exit 1; }
            sh -eu "$RUNNER_TEMP/build.sh"
          done
      # ホストに elixir があると、manifest.toml に無い elixir、mix、logger、eex が同梱される
      # （plugins-src/event_logger/README.md の「ビルド」）。.beam の数は共有パッケージの版を
      # 上げるたびに変わるので、同梱したアプリの名前を manifest.toml と突き合わせる。
      # manifest.toml には同梱されない dev の依存（gleeunit、envoy）も載るので、包含で比べる。
      - name: event_logger の成果物に manifest.toml に無いアプリが無いことを確かめる
        run: |
          set -eu
          export LC_ALL=C
          test -f plugins/event_logger/event_logger/ebin/event_logger.beam
          allowed=$( { echo event_logger; grep -o '^  { name = "[^"]*"' plugins-src/event_logger/manifest.toml | cut -d '"' -f 2; } | sort)
          bundled=$(find plugins/event_logger -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          extra=$(comm -13 <(echo "$allowed") <(echo "$bundled"))
          [ -z "$extra" ] || { echo "manifest.toml に無いアプリが同梱されている:" $extra; exit 1; }

  # 同じコミットから 2 回ビルドして同じイメージになること（#181 の完了条件）と、
  # 実行イメージの中身を検査する。定義は #181 のプランを参照。
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      # ビルドの再現性のため、コミット時刻を SOURCE_DATE_EPOCH として以降の step に渡す。
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # 同じ条件で 2 回ビルドし、OCI イメージとして書き出す。attestation はビルド時刻を
      # 含み同じイメージの定義の対象外なので provenance は付けない（#181）。
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image1.tar,rewrite-timestamp=true
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image2.tar,rewrite-timestamp=true
      - name: 2 回のビルドで同じイメージになることを確かめる
        run: |
          set -eu
          media="application/vnd.oci.image.manifest.v1+json"
          for i in 1 2; do
            tar -xOf "$RUNNER_TEMP/image$i.tar" index.json \
              | jq -r '.manifests[0].mediaType, .manifests[0].digest' > "$RUNNER_TEMP/manifest$i.txt"
            cat "$RUNNER_TEMP/manifest$i.txt"
            [ "$(sed -n 1p "$RUNNER_TEMP/manifest$i.txt")" = "$media" ] \
              || { echo "$i 回目の manifest が attestation を含む index になっている"; exit 1; }
          done
          diff "$RUNNER_TEMP/manifest1.txt" "$RUNNER_TEMP/manifest2.txt"
      # 続く検査のため、本体イメージとビルドステージをローカルに読み込む。
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nostr-no-su:ci
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: build
          load: true
          tags: nostr-no-su:ci-build
      - name: ビルドステージと実行ステージの OTP が一致することを確かめる
        run: |
          set -eu
          otp='io:format("~s ~s~n", [erlang:system_info(otp_release), string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"]))))]), halt().'
          build_otp=$(docker run --rm --entrypoint erl nostr-no-su:ci-build -noshell -eval "$otp")
          run_otp=$(docker run --rm --entrypoint erl nostr-no-su:ci -noshell -eval "$otp")
          echo "build: $build_otp"
          echo "run:   $run_otp"
          [ "$build_otp" = "$run_otp" ]
      - name: 実行イメージに gleam と rebar3 が無いことを確かめる
        run: |
          set -eu
          if docker run --rm --entrypoint sh nostr-no-su:ci -c 'command -v gleam || command -v rebar3'; then
            echo "実行イメージに gleam か rebar3 が残っている"
            exit 1
          fi
      - name: ADMIN_PORT が空白だけのとき healthcheck が待ち受けを叩かずに成功することを確かめる
        run: |
          set -eu
          cmd=$(docker image inspect nostr-no-su:ci --format '{{index .Config.Healthcheck.Test 1}}')
          docker run --rm -e ADMIN_PORT=' ' --entrypoint sh nostr-no-su:ci -c "$cmd"
          if docker run --rm --entrypoint sh nostr-no-su:ci -c "$cmd"; then
            echo "ADMIN_PORT 未設定でも healthcheck が待ち受けを叩かずに成功してしまった"
            exit 1
          fi
      - name: remsh の検査に共通の docker run 引数を用意する
        run: |
          echo "COMMON_ARGS=--read-only --tmpfs /tmp --cap-drop ALL -e DATABASE_URL=postgres://u:p@127.0.0.1:1/db -e ACCOUNT_MASTER_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -e ADMIN_PORT= -e PLUGIN_DIR=" >> "$GITHUB_ENV"
      # 以下 3 つは remsh の口（#211）を確かめる。到達できない DATABASE_URL でも
      # 本体は起動しバンカーのアクターは登録されるので、Postgres は要らない。
      - name: REMSH_ENABLED が true / false 以外なら起動しないことを確かめる
        run: |
          set -eu
          out=$(docker run --rm $COMMON_ARGS -e REMSH_ENABLED=yes nostr-no-su:ci 2>&1) && code=0 || code=$?
          echo "$out"
          [ "$code" -eq 1 ]
          echo "$out" | grep -q 'REMSH_ENABLED must be true or false'
      - name: 既定では分散ノードが立たないことを確かめる
        run: |
          set -eu
          c=$(docker run -d $COMMON_ARGS nostr-no-su:ci)
          trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs "$c"; docker rm -f "$c" >/dev/null; exit "$rc"' EXIT
          i=0
          until docker logs "$c" 2>&1 | grep -q '\[bunker\] account store unavailable'; do
            i=$((i + 1))
            [ "$i" -lt 60 ] || { echo "本体の起動ログが 60 秒待っても出なかった"; exit 1; }
            sleep 1
          done
          ps_out=$(docker exec "$c" ps -o comm)
          echo "$ps_out"
          if echo "$ps_out" | grep -qx epmd; then
            echo "既定なのに epmd が動いている"
            exit 1
          fi
          tcp_files="/proc/net/tcp"
          docker exec "$c" test -r /proc/net/tcp6 && tcp_files="$tcp_files /proc/net/tcp6"
          listen=$(docker exec "$c" awk 'FNR > 1 && $4 == "0A"' $tcp_files)
          if [ -n "$listen" ]; then
            echo "既定なのに LISTEN の待ち受けがある:"
            echo "$listen"
            exit 1
          fi
          set +e
          remsh_out=$(docker exec "$c" /app/start.sh remsh 2>&1)
          remsh_code=$?
          set -e
          echo "$remsh_out"
          [ "$remsh_code" -eq 1 ]
          echo "$remsh_out" | grep -q 'REMSH_ENABLED is not true'
          status=$(docker inspect -f '{{.State.Status}}' "$c")
          [ "$status" = running ]
      - name: REMSH_ENABLED=true で remsh からバンカーを kill して再起動を観測する
        run: |
          set -eu
          c=$(docker run -d $COMMON_ARGS -e REMSH_ENABLED=true nostr-no-su:ci)
          trap 'rc=$?; [ "$rc" -eq 0 ] || docker logs "$c"; docker rm -f "$c" >/dev/null; exit "$rc"' EXIT
          i=0
          until docker logs "$c" 2>&1 | grep -q '\[bunker\] account store unavailable'; do
            i=$((i + 1))
            [ "$i" -lt 60 ] || { echo "本体の起動ログが 60 秒待っても出なかった"; exit 1; }
            sleep 1
          done
          perm=$(docker exec "$c" stat -c '%a %U' /tmp/nostr-no-su-remsh.cookie)
          [ "$perm" = "600 nostr" ]
          expr='[N] = [X || X <- registered(), lists:prefix("nostr_no_su_bunker$", atom_to_list(X))], P1 = whereis(N), exit(P1, kill), timer:sleep(1000), P2 = whereis(N), io:format("bunker ~p ~p -> ~p restarted=~p~n", [N, P1, P2, is_pid(P2) andalso P2 =/= P1]).'
          out=$(printf '%s\n' "$expr" | docker exec -i "$c" /app/start.sh remsh)
          echo "$out"
          echo "$out" | grep -q 'restarted=true'
          ps_out=$(docker exec "$c" ps -o comm)
          echo "$ps_out"
          echo "$ps_out" | grep -qx epmd
          tcp_files="/proc/net/tcp"
          docker exec "$c" test -r /proc/net/tcp6 && tcp_files="$tcp_files /proc/net/tcp6"
          listen=$(docker exec "$c" awk 'FNR > 1 && $4 == "0A" { print FILENAME, $2 }' $tcp_files)
          echo "$listen"
          epmd_count=$(echo "$listen" | grep -c '^/proc/net/tcp 0100007F:1111$' || true)
          dist_count=$(echo "$listen" | { grep '^/proc/net/tcp 0100007F:' || true; } | grep -vc '^/proc/net/tcp 0100007F:1111$' || true)
          other_count=$(echo "$listen" | { grep -v '^/proc/net/tcp 0100007F:' || true; } | grep -vc '^/proc/net/tcp6 00000000000000000000000001000000:1111$' || true)
          [ "$epmd_count" -eq 1 ]
          [ "$dist_count" -eq 1 ]
          [ "$other_count" -eq 0 ]
          status=$(docker inspect -f '{{.State.Status}}' "$c")
          [ "$status" = running ]
