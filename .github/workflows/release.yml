name: release

# vX.Y.Z のタグの push で、イメージを ghcr.io/<owner>/<repo> に公開する。
# テストは再実行しないので、ci.yml が通った main のコミットにだけタグを切る（CONTRIBUTING.md の「リリース」）。
# arm64 は QEMU では BEAM のコンパイルが遅いため、platform ごとに native のランナーで
# ビルドし（build ジョブの matrix）、ダイジェストだけを push する。タグ（X.Y.Z、X.Y、
# latest）は merge ジョブがマルチアーキテクチャのマニフェストに付ける（#395）。
# packages: write を持つので、action はコミット SHA で固定し、版をコメントに添える。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  # GITHUB_TOKEN で ghcr に push するのに要る。
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 版を上げ忘れたタグで、中身と名前の違うイメージを公開しないように先に止める。
      - run: sh dev/check_release_version.sh "$GITHUB_REF_NAME"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 から 0.1.0、0.1、latest を付ける。0.x の間は minor が破壊的変更を
          # 含むので、major だけのタグ（0）は付けない。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          # 既定では実行時刻が入り、同じコミットでも config が変わってしまうため、
          # created ラベルもコミット時刻にする（同じイメージの定義は #181 のプラン、
          # 検査は ci.yml の docker-image ジョブ）。
          labels: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
      # ビルドの再現性のため、コミット時刻を SOURCE_DATE_EPOCH として以降の step に渡す。
      - run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # タグは付けず、ダイジェスト参照だけを push する（merge ジョブがマニフェストに
          # まとめる）。push: true では rewrite-timestamp を渡せないため outputs で
          # 指定する。同じコミットから同じイメージを作るため（#111）。
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
      - name: ダイジェストを書き出す
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 から 0.1.0、0.1、latest を付ける。0.x の間は minor が破壊的変更を
          # 含むので、major だけのタグ（0）は付けない。
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: マルチアーキテクチャのマニフェストを作る
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
      - name: 両方の platform が付いたことを確かめる
        run: |
          set -eu
          ref="ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"
          out=$(docker buildx imagetools inspect "$ref" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}')
          echo "$out"
          echo "$out" | grep -qx linux/amd64
          echo "$out" | grep -qx linux/arm64
