# Gleam の依存（Hex）は dependabot が追えないので手で上げる。
# tailwindcss、@tailwindcss/cli、daisyui を上げると priv/static/admin.css が変わり、
# dependabot は作り直さないので CI の css ジョブが落ちる。patch の更新は追わず
# （ignore）、minor 以上が来たら `npm ci && npm run build:css` の結果を commit に足す（#382）。
# 生成物をコミットせず CI と Dockerfile でビルドする案は採らない（docs/design-decisions.md）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-patch"]
      - dependency-name: "@tailwindcss/cli"
        update-types: ["version-update:semver-patch"]
      - dependency-name: daisyui
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
