services:
  nostr-no-su:
    image: ghcr.io/neverclear86/nostr-no-su:${NOSTR_NO_SU_VERSION:-latest}
    # 変数の意味は docs/configuration.md の「環境変数」の表にある。${...} の値は .env
    # （.env.example を複製して作る）で変える。秘密（ACCOUNT_MASTER_KEY と
    # ADMIN_PASSWORD）の値はこのファイルに書かないこと。
    # compose は docker-compose.yml（ソースからビルドする）と
    # docker-compose.release.yml（公開イメージを取る）の 2 つで、違うのはイメージの
    # 取り方の 1 行だけである。
    # In English: see "Configuration" in README.md. Set the values in .env, not in
    # this file, and never write the secrets in this file.
    environment:
      DATABASE_URL: ${DATABASE_URL-postgres://${POSTGRES_USER:-nostr}:${POSTGRES_PASSWORD:-nostr}@postgres:5432/${POSTGRES_DB:-nostr_no_su}}
      ACCOUNT_MASTER_KEY: ${ACCOUNT_MASTER_KEY:-}
      ADMIN_PORT: ${ADMIN_PORT-8080}
      ADMIN_BIND: 0.0.0.0
      # クラッシュダンプには管理パスワードと DB のパスワードが載るので、既定では
      # 書かない（ERL_CRASH_DUMP_BYTES が 0）。ルートが読み取り専用なので、書く
      # ように戻したときは tmpfs の /tmp に書き、コンテナーの再起動で消える。
      # 残す手順は docs/configuration.md の「docker compose の構成」にある。
      ERL_CRASH_DUMP: /tmp/erl_crash.dump
      ERL_CRASH_DUMP_BYTES: 0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-}
      PLUGIN_DIR: ${PLUGIN_DIR-/app/plugins:/plugins}
      PLUGIN_CONSOLE_LOGGER_ENABLED: ${PLUGIN_CONSOLE_LOGGER_ENABLED-true}
      DEDUP_CAPACITY: ${DEDUP_CAPACITY-4096}
      # true にすると VM の全て（復号した秘密鍵を含む）に到達できる。
      # 使い方は docs/configuration.md の「docker compose の構成」。
      REMSH_ENABLED: ${REMSH_ENABLED-false}
    volumes:
      # コンテナーは非 root（uid 1000）で動くため、ホスト側は誰でも読める権限に
      # しておくこと（chmod -R a+rX plugins）。プラグインがここへ書くことはない
      # ので読み取り専用でマウントする。同梱の event_logger と profile はイメージの
      # /app/plugins に入っているので、ここへ置き直す必要はない。
      - ./plugins:/plugins:ro
    ports:
      # ホストのループバックにだけ公開する。管理 UI は平文 HTTP で、接続
      # シークレットを含む bunker:// URI を表示するため。外部から到達させるときは
      # TLS を終端するリバースプロキシーを前に置くこと。
      - "127.0.0.1:${ADMIN_PORT:-8080}:${ADMIN_PORT:-8080}"
    # 本体のバンカーはアカウントとリレーの一覧を Postgres に保存し、同梱の event_logger
    # がイベントも同じ Postgres に保存する。Postgres が落ちていても本体は起動し、
    # バンカーは間隔を 5 秒から 2 分まで延ばしながらアカウントの読み込みを再試行する
    # （プラグインは動く。リレーの接続は DB から行を読めた後に開く）。
    depends_on:
      postgres:
        condition: service_healthy
    # 終了コードによらず再起動する。設定の不備（ACCOUNT_MASTER_KEY が空など）で
    # 終了したときは、docker が間隔を延ばしながら再起動を繰り返し、そのたびに
    # 理由の 1 行が出る。
    restart: unless-stopped
    # ルートは読み取り専用にし、書き込みは /tmp（メモリ上の tmpfs、再起動で
    # 消える）だけにする。wisp の一時ファイルと、書くように戻したときの
    # クラッシュダンプ（ERL_CRASH_DUMP）がここに書く。
    read_only: true
    tmpfs:
      - /tmp
    # 非 root で動き、特権の要る操作をしないので、ケーパビリティーは要らない。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # console_logger が 1 イベント 1 行を出すので、docker のログを
    # 10 MB × 3 世代で打ち切る。
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    # ダイジェストで固定する。上げるときはタグとダイジェストを一緒に変える。
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    # 値は .env で変える。効くのは postgres-data volume が空の初回だけ
    # （イメージが初期化時にしか資格情報を反映しない）。アプリの
    # DATABASE_URL の既定値はこの 3 変数から組み立てる。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nostr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nostr}
      POSTGRES_DB: ${POSTGRES_DB:-nostr_no_su}
    # ポートは意図的に公開しない。DB を使うのはアプリだけで、compose の
    # ネットワーク越しに到達できる。
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ はコンテナー内のシェルに展開させ、同じサービスの environment の
      # 値を読む（compose の ${...} で書くと既定値の写しが増える）。
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
